<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#ffffff; --surface:#ffffff; --panel:#f4f6f7; --ink:#12171c; --ink-2:#4c565f; --ink-3:#78848d;
  --rule:#dfe3e7; --rule-strong:#b9c1c8;
  --good:#0b7a3b; --good-rgb:11,122,59; --bad:#c0271c; --bad-rgb:192,39,28; --flag:#e8b006;
  --display:"Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --body:Roboto,system-ui,-apple-system,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  --sp-2:4px; --sp-3:6px; --sp-4:8px; --sp-5:12px; --sp-6:18px; --sp-7:28px; --sp-8:44px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101418; --surface:#161b21; --panel:#1b2129; --ink:#e9edf1; --ink-2:#a4b0b9; --ink-3:#7a858e;
    --rule:#262d34; --rule-strong:#3d464e;
    --good:#48b876; --good-rgb:72,184,118; --bad:#e5695c; --bad-rgb:229,105,92; --flag:#f0c552;
  }
}
:root[data-theme="dark"]{
  --ground:#101418; --surface:#161b21; --panel:#1b2129; --ink:#e9edf1; --ink-2:#a4b0b9; --ink-3:#7a858e;
  --rule:#262d34; --rule-strong:#3d464e;
  --good:#48b876; --good-rgb:72,184,118; --bad:#e5695c; --bad-rgb:229,105,92; --flag:#f0c552;
}
*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font-family:var(--body); font-size:.9375rem; line-height:1.55; margin:0;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px; margin:0 auto; padding:0 var(--sp-7) var(--sp-8)}
:focus-visible{outline:2px solid var(--flag); outline-offset:3px}

.bar{position:sticky; top:0; z-index:10; background:var(--ground); border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-5); padding:var(--sp-4) var(--sp-7)}
.bar .name{font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.02em;
  display:flex; align-items:center; gap:var(--sp-4)}
.bar .name::before{content:""; width:12px; height:12px; border-radius:2px; background:var(--good)}
.stamp{font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}

.mast{padding:var(--sp-8) 0 var(--sp-6); border-bottom:4px double var(--rule-strong)}
.kicker{font-weight:700; font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bad); margin:0 0 var(--sp-4)}
h1{font-family:var(--display); font-weight:700; text-transform:uppercase; font-size:3rem; line-height:.98;
  letter-spacing:-.01em; margin:0; max-width:15ch}
.dek{color:var(--ink-2); font-size:1rem; margin:var(--sp-5) 0 0; max-width:60ch}

h2{font-family:var(--display); font-weight:700; text-transform:uppercase; font-size:1.5rem; letter-spacing:.01em;
  margin:var(--sp-8) 0 var(--sp-4); padding-top:var(--sp-4); border-top:4px solid var(--ink)}
p{margin:0 0 var(--sp-5); max-width:66ch; color:var(--ink-2)}
p strong, li strong{color:var(--ink)}
ul{margin:0 0 var(--sp-5); padding-left:1.1rem; max-width:66ch; color:var(--ink-2)}
li{margin-bottom:var(--sp-3)}

table{width:100%; border-collapse:collapse; font-size:.875rem}
th,td{text-align:right; padding:var(--sp-4) var(--sp-4); border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); font-weight:700;
  border-bottom:2px solid var(--ink); vertical-align:bottom}
thead tr.grp th{border-bottom:0; padding-bottom:0; color:var(--ink-3); font-weight:500; letter-spacing:.1em}
thead tr.grp th.span{text-align:center; border-bottom:1px solid var(--rule-strong)}
td.num{font-family:var(--mono)}
tbody tr:last-child td{border-bottom:0}
.who{display:flex; align-items:center; gap:var(--sp-4); font-weight:700}
.who i{width:10px; height:10px; border-radius:2px; flex:none}
.rank{font-family:var(--mono); color:var(--ink-3); width:18px; text-align:right; font-weight:400}
td.odds{width:104px; padding:2px 1px}
.cell{height:30px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:500;
  border-radius:2px}
.scroller{overflow-x:auto; border:1px solid var(--rule); border-radius:4px; margin-top:var(--sp-5)}
.scroller table{min-width:620px}
.scroller.plain{border:0; border-radius:0}

.dist{display:flex; align-items:flex-end; gap:1px; height:34px}
.dist i{flex:1; background:var(--ink-3); opacity:.55; min-height:1px}
.dist i.hit{background:var(--good); opacity:.9}

.chart{margin-top:var(--sp-5)}
svg{display:block; width:100%; height:auto; overflow:visible}
.axis{fill:var(--ink-3); font-family:var(--mono); font-size:10px}
.gridline{stroke:var(--rule); stroke-width:1}
.baseline{stroke:var(--ink); stroke-width:1.5}
.series{fill:none; stroke-width:2.2; stroke-linejoin:round}
.legend{display:flex; flex-wrap:wrap; gap:var(--sp-5); margin-top:var(--sp-5); font-size:.8125rem; color:var(--ink-2)}
.legend span{display:flex; align-items:center; gap:var(--sp-3)}
.legend i{width:12px; height:3px; border-radius:1px}

.note{background:var(--panel); border-left:4px solid var(--flag); padding:var(--sp-5) var(--sp-6); margin:var(--sp-6) 0;
  font-size:.875rem; color:var(--ink-2)}
.foot{margin-top:var(--sp-8); padding-top:var(--sp-5); border-top:1px solid var(--rule); font-size:.8125rem; color:var(--ink-3)}
@media (max-width:720px){
  .wrap{padding-left:var(--sp-5); padding-right:var(--sp-5)}
  h1{font-size:2rem}
}
</style>

  <p class="foot" id="foot"></p>
</div>

/* ---------- the table ---------- */

function oddsCell(value){
  var text = value <= 0 ? "—" : value < 1 ? "<1%" : value >= 99.5 ? ">99%" : Math.round(value) + "%";
  var alpha = value <= 0 ? 0 : 0.06 + 0.0055 * value;
  return '<td class="odds"><div class="cell" style="background:rgba(var(--good-rgb),' + alpha.toFixed(3) + ')">'
    + text + "</div></td>";
}

function sparkline(player){
  var h = player.histogram, top = Math.max.apply(null, h.counts) || 1;
  return '<div class="dist">' + h.counts.map(function(c){
    return '<i style="height:' + Math.max(1, Math.round(100 * c / top)) + '%"></i>';
  }).join("") + "</div>";
}

var leader = Math.max.apply(null, P.map(function(p){ return p.points_now; }));
document.getElementById("odds").innerHTML =
  '<thead><tr class="grp"><th colspan="4"></th><th class="span" colspan="4">Projeção</th><th></th></tr>'
  + "<tr><th>Jogador</th><th>Pts</th><th>Atrás</th><th>Dobras</th><th>A somar</th><th>Total médio</th>"
  + "<th>Faixa 90%</th><th style='text-align:left'>Distribuição</th><th style='text-align:center'>Título</th></tr></thead><tbody>"
  + P.map(function(p, i){
      var gap = leader - p.points_now;
      return "<tr><td><span class='who'><span class='rank'>" + (i+1) + "</span><i style='background:"
        + colourOf(p.player) + "'></i>" + p.player + "</span></td>"
        + '<td class="num">' + p.points_now + "</td>"
        + '<td class="num" style="color:var(--ink-3)">' + (gap ? "−" + gap : "—") + "</td>"
        + '<td class="num">' + D.doubles_left[p.player] + "</td>"
        + '<td class="num">' + n(p.expected_remaining, 0) + "</td>"
        + '<td class="num">' + n(p.mean_final) + "</td>"
        + '<td class="num">' + Math.round(p.p5) + "–" + Math.round(p.p95) + "</td>"
        + '<td style="width:130px">' + sparkline(p) + "</td>"
        + oddsCell(p.win) + "</tr>";
    }).join("") + "</tbody>";

/* ---------- finishing places ---------- */

document.getElementById("places").innerHTML =
  "<thead><tr><th>Jogador</th>" + P[0].places.map(function(_, i){
      return "<th style='text-align:center'>" + (i+1) + "º</th>";
    }).join("") + "</tr></thead><tbody>"
  + P.map(function(p){
      return "<tr><td><span class='who'><i style='background:" + colourOf(p.player) + "'></i>" + p.player + "</span></td>"
        + p.places.map(function(v){ return oddsCell(v); }).join("") + "</tr>";
    }).join("") + "</tbody>";

/* ---------- squads ---------- */

document.getElementById("squads").innerHTML =
  "<thead><tr><th>Jogador</th><th style='text-align:left' colspan='4'>Times no 2º turno · pontos feitos (jogos restantes)</th>"
  + "<th>Feitos</th><th>Restam</th></tr></thead><tbody>"
  + P.map(function(p){
      var clubs = D.squads[p.player] || [];
      var made = clubs.reduce(function(a, c){ return a + c.points; }, 0);
      var left = clubs.reduce(function(a, c){ return a + c.left; }, 0);
      return "<tr><td><span class='who'><i style='background:" + colourOf(p.player) + "'></i>" + p.player + "</span></td>"
        + clubs.map(function(c){
            return "<td style='text-align:left'>" + c.club + " <span class='num' style='color:var(--ink-3)'>"
              + c.points + " (" + c.left + ")</span></td>";
          }).join("")
        + '<td class="num">' + made + '</td><td class="num">' + left + "</td></tr>";
    }).join("") + "</tbody>";

// The lead is measured against whoever is second on points, which is not
// always whoever is second on odds.
var byPoints = P.slice().sort(function(a, b){ return b.points_now - a.points_now; });
document.getElementById("dek").textContent =
  D.remaining_matches + " jogos restantes · " + (38 - D.history.rounds.length) + " rodadas · "
  + byPoints[0].player + " lidera com " + byPoints[0].points_now + " pontos, "
  + (byPoints[0].points_now - byPoints[1].points_now) + " à frente do " + byPoints[1].player + ".";
document.getElementById("tie-note").textContent =
  "Faixa 90%: 5% das simulações ficam abaixo, 5% acima. Empate na liderança em " + n(D.tie_at_the_top) + "%.";
document.getElementById("stamp").textContent = "atualizado " + (D.generated || "hoje");

/* ---------- the race ---------- */

(function(){
  var H = D.history, rounds = H.rounds, players = Object.keys(H.points);
  var W = 920, Ht = 360, M = {t:14, r:96, b:32, l:44};
  var iw = W-M.l-M.r, ih = Ht-M.t-M.b;
  var top = 0;
  players.forEach(function(p){ H.points[p].forEach(function(v){ top = Math.max(top, v); }); });
  top = Math.ceil(top / 25) * 25;
  var x = function(i){ return M.l + iw * i / Math.max(1, rounds.length-1); };
  var y = function(v){ return M.t + ih * (1 - v/top); };
  var parts = [];
  for (var g = 0; g <= top; g += 50){
    parts.push('<line class="gridline" x1="'+M.l+'" y1="'+y(g).toFixed(1)+'" x2="'+(M.l+iw)+'" y2="'+y(g).toFixed(1)+'"/>');
    parts.push('<text class="axis" x="'+(M.l-8)+'" y="'+(y(g)+3.5).toFixed(1)+'" text-anchor="end">'+g+"</text>");
  }
  parts.push('<line class="baseline" x1="'+M.l+'" y1="'+(M.t+ih)+'" x2="'+(M.l+iw)+'" y2="'+(M.t+ih)+'"/>');
  rounds.forEach(function(r, i){
    if (r % 5 === 0 || r === 1) parts.push('<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(Ht-10)+'" text-anchor="middle">'+r+"</text>");
  });
  // round 20 scores for nobody: mark the gap rather than leaving it unexplained
  var twenty = rounds.indexOf(20);
  if (twenty >= 0){
    parts.push('<line x1="'+x(twenty).toFixed(1)+'" y1="'+M.t+'" x2="'+x(twenty).toFixed(1)+'" y2="'+(M.t+ih)
      +'" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>');
    parts.push('<text class="axis" x="'+(x(twenty)+5).toFixed(1)+'" y="'+(M.t+12)+'">draft do 2º turno</text>');
  }
  players.forEach(function(p){
    var d = H.points[p].map(function(v, i){ return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");
    parts.push('<path class="series" d="'+d+'" stroke="'+colourOf(p)+'"/>');
    var last = H.points[p][H.points[p].length-1];
    parts.push('<text class="axis" x="'+(M.l+iw+8)+'" y="'+(y(last)+3.5).toFixed(1)+'" fill="'+colourOf(p)
      +'" style="font-family:var(--body);font-weight:700;font-size:11px">'+p+" "+last+"</text>");
  });
  document.getElementById("race").innerHTML = parts.join("");
  document.getElementById("race-legend").innerHTML = players.map(function(p){
    return "<span><i style='background:"+colourOf(p)+"'></i>"+p+"</span>";
  }).join("");
})();

/* ---------- doubles ---------- */

var used = D.doubles_used;
var gained = {};
used.forEach(function(d){ gained[d.player] = (gained[d.player] || 0) + d.gained; });
document.getElementById("doubles-intro").textContent =
  "4 por turno, não acumulam. " + used.length + " gastas, "
  + used.filter(function(d){ return d.gained > 0; }).length + " com retorno, "
  + Object.values(gained).reduce(function(a, b){ return a + b; }, 0) + " pontos extras. Restam: "
  + Object.keys(D.doubles_left).map(function(p){ return p + " " + D.doubles_left[p]; }).join(" · ") + ".";

document.getElementById("doubles").innerHTML =
  "<thead><tr><th>Rodada</th><th style='text-align:left'>Jogador</th><th style='text-align:left'>Time</th>"
  + "<th style='text-align:left'>Adversário</th><th>Placar</th><th>Pontos extras</th></tr></thead><tbody>"
  + used.map(function(d){
      return '<tr><td class="num">' + d.round + "</td>"
        + "<td><span class='who'><i style='background:"+colourOf(d.player)+"'></i>"+d.player+"</span></td>"
        + "<td style='text-align:left'>" + d.team + "</td>"
        + "<td style='text-align:left'>" + d.opponent + "</td>"
        + '<td class="num">' + d.score + "</td>"
        + '<td class="num" style="color:' + (d.gained > 0 ? "var(--good)" : "var(--ink-3)") + '">'
        + (d.gained > 0 ? "+" + d.gained : "0") + "</td></tr>";
    }).join("")
  + "</tbody><tfoot><tr><td colspan='5' style='border:0'></td><td class='num' style='border:0;font-weight:700'>"
  + Object.values(gained).reduce(function(a, b){ return a + b; }, 0) + "</td></tr></tfoot>";

/* ---------- method ---------- */

document.getElementById("method").innerHTML =
  "<ul>"
  + "<li>Classificação: o mesmo arquivo que o app lê.</li>"
  + "<li>Jogos restantes: modelo Elo do projeto, temporada simulada inteira (os times de um jogador se enfrentam).</li>"
  + "<li>Dobras restantes: assumidas nos jogos de maior chance de pontuar.</li>"
  + "<li>Rodada 20 não pontua: é o draft do 2º turno.</li>"
  + "</ul>";

document.getElementById("foot").innerHTML =
  "Sem as dobras restantes: " + P[0].player + " 87%. Com elas: " + Math.round(P[0].win) + "%. · "
  + "Dados: <code>app/football/consumer_bundle.json</code>.";
})();
</script>
