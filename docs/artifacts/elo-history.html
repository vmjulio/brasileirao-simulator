<title>Vinte e três anos de rating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Source+Sans+3:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#efebe2; --surface:#faf8f3; --ink:#14181b; --ink-2:#4a5157; --ink-3:#7c858c;
  --rule:#d8d2c6; --rule-strong:#b9b1a1;
  --ocean:#1b6b8c; --ocean-soft:rgba(27,107,140,.14);
  --sun:#e8a02e; --clay:#b4472e;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  --sp-2:4px; --sp-3:6px; --sp-4:8px; --sp-5:12px; --sp-6:18px; --sp-7:28px; --sp-8:44px;
  --radius:6px; --pill:999px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14181b; --surface:#1b2024; --ink:#efebe2; --ink-2:#a9b2b8; --ink-3:#7c858c;
    --rule:#2c3238; --rule-strong:#454d54;
    --ocean:#5fb3d4; --ocean-soft:rgba(95,179,212,.18); --sun:#f2b857; --clay:#e0705a;
  }
}
:root[data-theme="dark"]{
  --ground:#14181b; --surface:#1b2024; --ink:#efebe2; --ink-2:#a9b2b8; --ink-3:#7c858c;
  --rule:#2c3238; --rule-strong:#454d54;
  --ocean:#5fb3d4; --ocean-soft:rgba(95,179,212,.18); --sun:#f2b857; --clay:#e0705a;
}
*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font-family:var(--body); font-size:.9375rem; line-height:1.6; margin:0;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1040px; margin:0 auto; padding:0 var(--sp-7) var(--sp-8)}
:focus-visible{outline:2px solid var(--sun); outline-offset:3px}

.bar{position:sticky; top:0; z-index:10; background:var(--ground); border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-5); padding:var(--sp-4) var(--sp-7)}
.bar .name{font-family:var(--display); font-weight:700; font-size:.9375rem; display:flex; align-items:center; gap:var(--sp-4)}
.bar .name::before{content:""; width:14px; height:14px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, var(--sun) 0 42%, var(--ocean) 43% 100%)}
.switch{display:flex; gap:var(--sp-2)}
.switch button{font:inherit; font-size:.75rem; font-weight:600; border:1px solid var(--rule-strong); background:var(--surface);
  color:var(--ink-2); border-radius:var(--pill); padding:3px 12px; cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--ocean); border-color:var(--ocean); color:var(--surface)}

.mast{padding:var(--sp-8) 0 var(--sp-6); position:relative; overflow:hidden}
.mast::before{content:""; position:absolute; right:-80px; top:-70px; width:240px; height:240px; border-radius:50%;
  border:18px solid var(--ocean-soft)}
.kicker{font-family:var(--mono); font-size:.75rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ocean); margin:0 0 var(--sp-5)}
h1{font-family:var(--display); font-size:3rem; font-variation-settings:"wdth" 92; font-weight:800; line-height:1;
  letter-spacing:-.02em; margin:0; max-width:16ch}
.dek{color:var(--ink-2); font-size:1rem; margin:var(--sp-6) 0 0; max-width:60ch}

h2{font-family:var(--display); font-size:1.6rem; font-weight:700; line-height:1.1; margin:var(--sp-8) 0 var(--sp-4);
  display:flex; align-items:baseline; gap:var(--sp-5); max-width:26ch}
h2::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--ocean); flex:none; transform:translateY(-4px)}
p{margin:0 0 var(--sp-5); max-width:66ch; color:var(--ink-2)}
p strong, li strong{color:var(--ink)}
ul{margin:0 0 var(--sp-5); padding-left:1.1rem; max-width:66ch; color:var(--ink-2)}
li{margin-bottom:var(--sp-3)}

.controls{display:flex; gap:var(--sp-5); flex-wrap:wrap; align-items:center; margin-top:var(--sp-6)}
.pills{display:flex; gap:var(--sp-2); flex-wrap:wrap}
.pill{background:var(--surface); border:1px solid var(--rule); color:var(--ink-2); border-radius:var(--pill);
  padding:var(--sp-3) var(--sp-5); font:inherit; font-size:.8125rem; font-weight:600; cursor:pointer}
.pill:hover{border-color:var(--ocean); color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ocean); border-color:var(--ocean); color:var(--surface)}
.clear{margin-left:auto; font:inherit; font-size:.8125rem; background:none; border:1px solid var(--rule-strong);
  color:var(--ink-2); border-radius:var(--pill); padding:3px 14px; cursor:pointer}

.chart{background:var(--surface); border-radius:var(--radius); padding:var(--sp-6); margin-top:var(--sp-5); position:relative}
svg{display:block; width:100%; height:auto; overflow:visible}
.axis{fill:var(--ink-3); font-family:var(--mono); font-size:10px}
.gridline{stroke:var(--rule); stroke-width:1}
.baseline{stroke:var(--ink-2); stroke-width:1.25}
.line{fill:none; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round}
.era{fill:var(--ink-3); font-family:var(--mono); font-size:9.5px; opacity:.75}
.eraline{stroke:var(--rule-strong); stroke-width:1; stroke-dasharray:3 3}
.tip{position:absolute; pointer-events:none; background:var(--ground); border:1px solid var(--rule-strong);
  border-radius:var(--radius); padding:var(--sp-4) var(--sp-5); font-size:.8125rem; min-width:190px;
  box-shadow:0 6px 20px rgba(20,24,27,.16)}
.tip .when{font-family:var(--mono); font-size:.7rem; color:var(--ink-3); margin-bottom:var(--sp-3)}
.tip .row{display:flex; justify-content:space-between; gap:var(--sp-5); padding:1px 0}
.tip .row b{font-family:var(--mono); font-weight:500}
.tip .sw{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:var(--sp-3)}

.legend{display:flex; flex-wrap:wrap; gap:var(--sp-2) var(--sp-4); margin-top:var(--sp-5); padding-top:var(--sp-5); border-top:1px solid var(--rule)}
.lg{display:flex; align-items:center; gap:var(--sp-3); font-size:.8125rem; color:var(--ink-2); background:none; border:0;
  padding:2px var(--sp-3); border-radius:var(--pill); cursor:pointer; font-family:inherit}
.lg:hover{color:var(--ink)}
.lg[aria-pressed="true"]{background:var(--ocean-soft); color:var(--ink); font-weight:600}
.lg i{width:10px; height:10px; border-radius:50%; flex:none}

table{width:100%; border-collapse:collapse; font-size:.8125rem; margin-top:var(--sp-5)}
th,td{text-align:right; padding:var(--sp-4); border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-2)}
td.num{font-family:var(--mono)}
td.name{font-weight:600}
.scroller{overflow-x:auto; background:var(--surface); border-radius:var(--radius); padding:var(--sp-4) var(--sp-6); margin-top:var(--sp-5)}
.scroller table{min-width:640px}
.foot{margin-top:var(--sp-8); padding-top:var(--sp-5); border-top:1px solid var(--rule); font-size:.8125rem; color:var(--ink-3)}
@media (max-width:760px){
  .wrap{padding-left:var(--sp-5); padding-right:var(--sp-5)}
  h1{font-size:2.1rem} .mast::before{display:none}
}
</style>

<header class="bar">
  <div class="wrap">
    <div class="name" data-t="brand"></div>
    <div class="switch">
      <button type="button" id="pt" aria-pressed="true">PT</button>
      <button type="button" id="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="mast">
    <p class="kicker" data-t="kicker"></p>
    <h1 data-t="headline"></h1>
    <p class="dek" data-t="dek"></p>
  </div>

  <section>
    <div class="controls">
      <div class="pills" id="range-pills"></div>
      <button class="clear" type="button" id="clear" data-t="clear"></button>
    </div>

    <div class="chart">
      <div class="plot" id="plot" style="position:relative">
        <svg id="chart" viewBox="0 0 920 430" role="img" aria-label="Elo ratings over time"></svg>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <p data-t="chart_note" style="margin-top:var(--sp-5); font-size:.8125rem; color:var(--ink-3)"></p>
  </section>

  <section>
    <h2 data-t="read_heading"></h2>
    <div data-t="read_body" data-html="1"></div>
  </section>

  <section>
    <h2 data-t="table_heading"></h2>
    <p data-t="table_intro"></p>
    <div class="scroller"><table id="table"></table></div>
  </section>

  <p class="foot" data-t="foot" data-html="1"></p>
</div>

    }).filter(Boolean).sort(function(a, b){ return b.v - a.v; });
  var used = [];
  labelled.slice(0, focus.length ? labelled.length : 6).forEach(function(item){
    var ly = y(item.v);
    while (used.some(function(u){ return Math.abs(u-ly) < 12; })) ly += 12;
    used.push(ly);
    parts.push('<text class="axis" x="' + (M.l+IW+8) + '" y="' + (ly+3.5).toFixed(1) + '" fill="' + colourOf(item.c.name)
      + '" style="font-family:var(--body);font-size:11px;font-weight:600">' + nameOf(item.c.name) + "</text>");
  });

  parts.push('<rect id="hit" x="' + M.l + '" y="' + M.t + '" width="' + IW + '" height="' + IH + '" fill="transparent"/>');
  parts.push('<line id="cross" x1="0" x2="0" y1="' + M.t + '" y2="' + (M.t+IH) + '" stroke="var(--ink-2)" stroke-width="1" opacity=".4" style="display:none"/>');
  document.getElementById("chart").innerHTML = parts.join("");
  wireHover(months, x, y);
}

function wireHover(months, x, y){
  var svg = document.getElementById("chart"), tip = document.getElementById("tip");
  var hit = document.getElementById("hit"), cross = document.getElementById("cross");
  function show(clientX){
    var box = svg.getBoundingClientRect(), sx = (clientX - box.left) * (W / box.width);
    var i = Math.max(0, Math.min(months.length-1, Math.round((sx - M.l) / (IW / Math.max(1, months.length-1)))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.style.display = "";
    var list = CLUBS.map(function(c){ return {name: c.name, v: c.points[from+i]}; })
      .filter(function(r){ return r.v !== null && r.v !== undefined; })
      .filter(function(r){ return !focus.length || focus.indexOf(r.name) >= 0; })
      .sort(function(a, b){ return b.v - a.v; });
    var shown = focus.length ? list : list.slice(0, 8);
    tip.innerHTML = '<div class="when">' + months[i] + "</div>" + shown.map(function(r){
      return '<div class="row"><span><i class="sw" style="background:' + colourOf(r.name) + '"></i>' + nameOf(r.name)
        + "</span><b>" + Math.round(r.v) + "</b></div>";
    }).join("") + (!focus.length && list.length > 8 ? '<div class="row" style="color:var(--ink-3)"><span>+ '
      + (list.length-8) + (lang === "pt" ? " outros" : " more") + "</span></div>" : "");
    tip.hidden = false;
    var px = (x(i)/W) * box.width;
    tip.style.left = Math.max(0, Math.min(box.width - tip.offsetWidth - 10, px + 14)) + "px";
    tip.style.top = "10px";
  }
  hit.addEventListener("mousemove", function(e){ show(e.clientX); });
  hit.addEventListener("touchstart", function(e){ show(e.touches[0].clientX); }, {passive:true});
  hit.addEventListener("touchmove", function(e){ show(e.touches[0].clientX); }, {passive:true});
  document.getElementById("plot").addEventListener("mouseleave", function(){
    tip.hidden = true; cross.style.display = "none";
  });
}

function renderTable(){
  var head = lang === "pt"
    ? ["Clube", "Hoje", "Mais alto", "Quando", "Mais baixo", "Quando", "Desde", "Partidas"]
    : ["Club", "Today", "Highest", "When", "Lowest", "When", "Since", "Matches"];
  var rows = CLUBS.map(function(c){
    return '<tr><td class="name"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'
      + colourOf(c.name) + ';margin-right:8px"></i>' + nameOf(c.name) + "</td>"
      + '<td class="num">' + Math.round(c.now) + "</td>"
      + '<td class="num">' + Math.round(c.peak) + '</td><td class="num">' + c.peak_when + "</td>"
      + '<td class="num">' + Math.round(c.low) + '</td><td class="num">' + c.low_when + "</td>"
      + '<td class="num">' + c.first + '</td><td class="num">' + c.matches.toLocaleString(lang === "pt" ? "pt-BR" : "en-US")
      + "</td></tr>";
  }).join("");
  document.getElementById("table").innerHTML =
    "<thead><tr>" + head.map(function(h){ return "<th>" + h + "</th>"; }).join("") + "</tr></thead><tbody>" + rows + "</tbody>";
}

document.getElementById("clear").addEventListener("click", function(){ focus = []; renderLegend(); renderChart(); });
document.getElementById("pt").addEventListener("click", function(){ lang = "pt"; paint(); });
document.getElementById("en").addEventListener("click", function(){ lang = "en"; paint(); });
paint();
})();
</script>
