var TAGS = {
  flat: {pt: "sem efeito", en: "no effect"},
  near: {pt: "quase", en: "near miss"},
  worse: {pt: "piorou", en: "worse"},
  fine: {pt: "já estava certo", en: "already right"}
};

function paint(){
  var t = T[lang];
  document.documentElement.setAttribute("lang", lang === "pt" ? "pt-BR" : "en");
  [].forEach.call(document.querySelectorAll("[data-t]"), function(el){
    var v = t[el.getAttribute("data-t")];
    if (v === undefined) return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.getElementById("pt").setAttribute("aria-pressed", String(lang === "pt"));
  document.getElementById("en").setAttribute("aria-pressed", String(lang === "en"));

  document.getElementById("counts").innerHTML =
    '<div class="ct"><div class="v">' + ENTRIES.length + '</div><div class="k">' + t.c_tested + "</div></div>"
    + '<div class="ct"><div class="v">3</div><div class="k">' + t.c_passed + "</div></div>"
    + '<div class="ct"><div class="v">17</div><div class="k">' + t.c_registered + "</div></div>";

  var labels = lang === "pt"
    ? {diff: "diferença", ci: "intervalo 95%", better: "melhor em", seasons: "temporadas", matches: "partidas"}
    : {diff: "difference", ci: "95% interval", better: "better in", seasons: "seasons", matches: "matches"};
  document.getElementById("ledger").innerHTML = ENTRIES.map(function(e){
    var text = e[lang];
    var rows = "";
    var diff = lang === "pt" ? e.diff : (e.diff_en || e.diff);
    var ci = lang === "pt" ? e.ci : (e.ci_en || e.ci);
    var note = lang === "pt" ? e.note : (e.note_en || e.note);
    if (diff) rows += row(labels.diff, diff);
    if (ci) rows += row(labels.ci, ci);
    if (e.better) rows += row(labels.better, e.better + (lang === "pt" ? " temporadas" : " seasons"));
    if (!diff && note && note !== "—") rows += row(lang === "pt" ? "medida" : "measured", note);
    rows += row(labels.seasons, e.seasons);
    rows += row(labels.matches, e.matches);
    return '<div class="entry"><div><span class="tag ' + e.tag + '">' + TAGS[e.tag][lang] + "</span>"
      + '<div class="idea">' + text.idea + '</div><div class="hoped">' + text.hoped + "</div>"
      + '<div class="found">' + text.found + "</div></div>"
      + '<div class="numbers">' + rows + "</div></div>";
  }).join("");
}

function row(key, value){
  return "<div><span>" + key + "</span><span>" + value + "</span></div>";
}

document.getElementById("pt").addEventListener("click", function(){ lang = "pt"; paint(); });
document.getElementById("en").addEventListener("click", function(){ lang = "en"; paint(); });
paint();
})();
</script>
